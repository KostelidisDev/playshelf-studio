# Tests on every push and pull request, then builds the standalone app for
# macOS, Windows and Linux on amd64 and arm64. Pushing a v* tag also publishes
# a GitHub Release with all six builds attached (the tag becomes the version;
# see build.py).
#
# Outside pull requests, the macOS and Windows builds are signed once their
# secrets are set (see "Code signing" in README.md). Without them the builds are
# still produced, just unsigned (macOS: ad hoc).

name: Build

on:
  push:
    branches: ["main"]
    tags: ["v*.*.*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.14"

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Lint with flake8
        if: runner.os == 'Linux'
        run: |
          python -m pip install flake8
          # Syntax errors and undefined names fail the build; the rest only warns.
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      - name: Run tests
        run: python -m unittest -v

  build:
    name: Build (${{ matrix.platform }}-${{ matrix.arch }})
    needs: test
    runs-on: ${{ matrix.runner }}
    env:
      SIGN_MACOS: ${{ matrix.platform == 'macos' && github.event_name != 'pull_request' && secrets.MACOS_CERTIFICATE_P12 != '' }}
      SIGN_WINDOWS: ${{ matrix.platform == 'windows' && github.event_name != 'pull_request' && secrets.SIGNPATH_API_TOKEN != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux,   arch: x64,   runner: ubuntu-26.04 }
          - { platform: linux,   arch: arm64, runner: ubuntu-26.04-arm }
          - { platform: windows, arch: x64,   runner: windows-2025 }
          - { platform: windows, arch: arm64, runner: windows-11-arm }
          - { platform: macos,   arch: x64,   runner: macos-26-intel }
          - { platform: macos,   arch: arm64, runner: macos-26 }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install Tk runtime (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libtk8.6
      - name: Check Tkinter is available
        run: python -c "import tkinter; tkinter.Tcl(); print('Tk', tkinter.TkVersion)"
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt
      - name: Resolve version
        id: version
        env:
          # On pull requests github.sha is a temporary merge commit; use the PR's head.
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # The tag for releases, the short commit hash otherwise.
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then version="$GITHUB_REF_NAME"; else version="${COMMIT_SHA::7}"; fi
          echo "Version: ${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Set up signing and notarization (macOS)
        if: env.SIGN_MACOS == 'true'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          # A throwaway keychain that holds only the Developer ID certificate, so codesign never prompts.
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -base64 24)"
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"
          identity="$(security find-identity -v -p codesigning "$keychain" | awk -F'"' '/Developer ID Application/ { print $2; exit }')"
          if [ -z "$identity" ]; then echo "::error::No Developer ID Application identity in MACOS_CERTIFICATE_P12"; exit 1; fi
          echo "MACOS_CODESIGN_IDENTITY=${identity}" >> "$GITHUB_ENV"
          # build.py notarizes when these are set.
          echo "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/notary_key.p8"
          echo "NOTARY_API_KEY_PATH=$RUNNER_TEMP/notary_key.p8" >> "$GITHUB_ENV"
          echo "NOTARY_API_KEY_ID=${APPLE_API_KEY_ID}" >> "$GITHUB_ENV"
          echo "NOTARY_API_ISSUER_ID=${APPLE_API_ISSUER_ID}" >> "$GITHUB_ENV"
      - name: Build
        run: python build.py "${{ steps.version.outputs.version }}"
      - name: Package
        id: package
        run: |
          base="PlayShelfStudio-${{ steps.version.outputs.version }}-${{ matrix.platform }}-${{ matrix.arch }}"
          mkdir -p release
          case "${{ matrix.platform }}" in
            macos)   ditto -c -k --sequesterRsrc --keepParent dist/PlayShelfStudio.app "release/${base}.zip" ;;
            linux)   tar -czf "release/${base}.tar.gz" -C dist PlayShelfStudio ;;  # tar keeps the exec bit
            windows) cp dist/PlayShelfStudio.exe "release/${base}.exe" ;;
          esac
          ls -l release
          echo "name=${base}" >> "$GITHUB_OUTPUT"
      - name: Upload unsigned executable (Windows)
        id: unsigned
        if: env.SIGN_WINDOWS == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.name }}-unsigned
          path: release/*.exe
          if-no-files-found: error
          retention-days: 1
      - name: Sign with SignPath (Windows)
        if: env.SIGN_WINDOWS == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          # Releases get the real certificate after an approver signs off in SignPath;
          # other builds get SignPath's test certificate, which checks the pipeline end to end.
          signing-policy-slug: ${{ github.ref_type == 'tag' && 'release-signing' || 'test-signing' }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: ${{ github.ref_type == 'tag' && 3600 || 600 }}
          output-artifact-directory: signed
      - name: Replace with signed executable (Windows)
        if: env.SIGN_WINDOWS == 'true'
        shell: pwsh
        run: |
          $exe = "${{ steps.package.outputs.name }}.exe"
          Copy-Item "signed/$exe" "release/$exe" -Force
          $signature = Get-AuthenticodeSignature "release/$exe"
          "$($signature.Status): $($signature.SignerCertificate.Subject)"
          if ($signature.Status -eq 'NotSigned') { throw "$exe is not signed" }
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.name }}
          path: release/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l release
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" --title "PlayShelf Studio $GITHUB_REF_NAME" --generate-notes --verify-tag
